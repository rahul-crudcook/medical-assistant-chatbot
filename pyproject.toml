[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-assistant-chatbot"
version = "0.1.0"
description = "Streamlit medical assistant (model-led) with multi-intent routing"
requires-python = ">=3.10"
dependencies = [
"streamlit>=1.37.0",
"requests>=2.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100